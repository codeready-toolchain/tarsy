name: pr-title

# pull_request_target runs with a token that can comment, including on fork PRs.
# Do not check out pull request code in this workflow; it only reads the event title.
on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

jobs:
  conventional:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- pr-title-conventional -->';
            const warning =
              `${marker}\nPlease rename this PR to conventional commit form, e.g. \`fix: ...\` or \`feat(scope): ...\`. See CONTRIBUTING.md.`;
            const title = context.payload.pull_request.title || '';
            const ok = /^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)\s*(\([a-zA-Z0-9._-]+\))?\s*:\s+\S.*$/.test(title);
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;

            async function findWarningComment() {
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner,
                repo,
                issue_number,
                per_page: 100,
              });
              return comments.find((c) => (c.body || '').includes(marker));
            }

            async function upsertOrClearWarning(valid) {
              try {
                const existing = await findWarningComment();
                if (valid) {
                  if (existing) {
                    await github.rest.issues.deleteComment({
                      owner,
                      repo,
                      comment_id: existing.id,
                    });
                  }
                  return;
                }
                if (existing) {
                  await github.rest.issues.updateComment({
                    owner,
                    repo,
                    comment_id: existing.id,
                    body: warning,
                  });
                  return;
                }
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number,
                  body: warning,
                });
              } catch (err) {
                // Title validity is the check result. Comment updates are best-effort.
                core.warning(`Could not update PR title comment: ${err.message || err}`);
              }
            }

            if (ok) {
              core.info('PR title OK');
              await upsertOrClearWarning(true);
              return;
            }

            await upsertOrClearWarning(false);
            core.setFailed(`PR title must use conventional commits, got: ${title}`);
