name: Feature request
description: Propose a change after checking it is not already tracked
title: "[FEATURE]: "
labels: ["enhancement"]
body:
  - type: checkboxes
    id: search
    attributes:
      label: Due diligence
      options:
        - label: I searched existing issues and did not find a duplicate
          required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What pain does this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Optional approach. Maintainers may redesign.
    validations:
      required: false
